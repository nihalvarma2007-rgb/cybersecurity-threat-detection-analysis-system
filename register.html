<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Web Security Analyzer</title>

    <link rel="stylesheet" href="css/page.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">🛡️</div>

            <h1>Web Security Analyzer</h1>
            <p class="subtitle">Create your security account</p>

            <h2>Create Account</h2>
            <p class="description">
                Register to start analyzing website security
            </p>

            <form id="registerForm">

                <label for="registerName">Full Name</label>

                <input type="text" id="registerName" placeholder="Enter your name" required>

                <label for="registerEmail">Email</label>

                <input type="email" id="registerEmail" placeholder="Enter your email" required>

                <label for="registerPassword">Password</label>

                <div class="password-box">

                    <input type="password" id="registerPassword" placeholder="Create a password" required
                        oninput="checkPasswordStrength()">

                    <button type="button" class="show-password" onclick="togglePassword('registerPassword', this)">
                        👁
                    </button>

                </div>

                <div class="password-strength">

                    <div id="strengthBar"></div>

                </div>

                <p id="strengthText">
                    Password strength
                </p>

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p id="registerMessage" class="message"></p>

            </form>

            <p class="switch-page">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

    </div>

    <script src="css/js/auth.js"></script>

</body>

</html>
